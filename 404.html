<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>404 — страница не найдена · P.Cash</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Work+Sans:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0E0F0D; --paper:#F0EEE7; --soft:#8A8F86; --orange:#FF6A1A; --go:#35C87E; --line:rgba(240,238,231,0.12); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:var(--ink); color:var(--paper); font-family:'Work Sans',sans-serif; display:flex; align-items:center; justify-content:center; padding:24px; background-image:radial-gradient(rgba(240,238,231,0.05) 1px, transparent 1px); background-size:26px 26px; }
  .box { text-align:center; max-width:460px; position:relative; }
  .glow { position:absolute; top:-40px; left:50%; transform:translateX(-50%); width:300px; height:300px; border-radius:50%; background:radial-gradient(circle, rgba(255,106,26,0.18), transparent 68%); z-index:-1; }
  .mark { width:80px; height:80px; margin:0 auto 26px; display:block; }
  .pre-ring { transform-origin:24px 24px; animation:spin 4s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .code { font-family:'Newsreader',serif; font-size:88px; font-weight:500; letter-spacing:-0.02em; line-height:1; }
  .code .z { color:var(--orange); }
  h1 { font-family:'Newsreader',serif; font-weight:500; font-size:24px; margin:18px 0 10px; }
  p { color:var(--soft); font-size:15px; line-height:1.6; margin-bottom:28px; }
  .btn { display:inline-block; background:var(--go); color:#fff; font-weight:500; font-size:15px; padding:13px 26px; border-radius:10px; text-decoration:none; transition:transform .2s, box-shadow .2s; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(53,200,126,0.4); }
  .en { display:block; font-size:12px; color:var(--soft); margin-top:22px; }
</style>
</head>
<body>
  <div class="box">
    <div class="glow"></div>
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
      <path class="pre-ring" d="M37.5 13 A17 17 0 1 0 37.5 35" fill="none" stroke="#FF6A1A" stroke-width="4.5" stroke-linecap="round"/>
      <rect x="16.4" y="14.2" width="5" height="19.6" rx="2.3" fill="#F0EEE7"/>
      <circle cx="22.6" cy="18.8" r="6.4" fill="#F0EEE7"/>
      <circle cx="23.3" cy="18.8" r="2.6" fill="#FF6A1A"/>
    </svg>
    <div class="code">4<span class="z">0</span>4</div>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка. Вернёмся на главную — там всё на месте.</p>
    <a class="btn" href="/">На главную</a>
    <span class="en">Page not found — <a href="/" style="color:var(--soft)">go home</a></span>
  </div>
</body>
</html>
